<!-- Config dialog shipped by the relay plugin. The manager's plugin-config host
     (src/manager/plugin-config.js) renders this into the manager DOM and owns the generic
     open/close + Apply/Cancel wiring; the markup reuses the manager's .dialog-* classes so it
     matches every other dialog. {{pluginIcon}} is the plugin's icon (a var); {{relayConfig*}} are
     i18n keys.

     The dialog is deliberately EMPTY right now. Both things it used to ask for are gone: the
     backend root is the app's own url (relay.js: configuredBaseUrl — one source instead of two
     that can drift), and the credential is the profile's relay login session, so nothing has to be
     baked into the build. The shell stays because further relay capabilities belong in this plugin
     (see its README) and will want settings; a field added here binds itself via data-config-key,
     no host change needed. -->
<div class="dialog-overlay plugin-config-overlay hidden">
  <div class="dialog">
    <div class="dialog-header">
      <img src="{{pluginIcon}}" alt="">
      <span class="dialog-title">{{relayConfigTitle}}</span>
      <button class="dialog-close" type="button">✕</button>
    </div>
    <div class="dialog-fields">
      <span class="field-hint">{{relayConfigEmpty}}</span>
    </div>
    <!-- Apply commits the edit to the app's config; Cancel/✕/Esc discard. The host wires these by
         class (.plugin-config-apply / .plugin-config-cancel). -->
    <div class="confirm-actions">
      <button class="btn-cancel plugin-config-cancel" type="button">{{pluginConfigCancel}}</button>
      <button class="btn-save plugin-config-apply" type="button">{{pluginConfigApply}}</button>
    </div>
  </div>
</div>
