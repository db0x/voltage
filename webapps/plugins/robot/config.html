<!-- Config dialog shipped by the robot plugin (part of the plugin). The manager's plugin-config
     host (src/manager/plugin-config.js) renders this into the manager DOM and owns the generic
     open/close + Apply/Cancel wiring; the markup reuses the manager's .dialog-* classes so it
     matches every other dialog. {{pluginIcon}} is the plugin's icon (a var); {{robot*}} are i18n
     keys.

     The actions are a repeatable list (data-config-list="actions"): the host clones <template
     data-config-row> per stored entry (plus a trailing blank row, dropped again if left untouched),
     binds each row's data-config-field controls into one array entry, and the + button appends a
     row. robot.js receives config.actions = [{ target, identifier, value }, …] and runs them in the
     order they appear here — so row order is the execution order.

     The value column only applies to the "fill in text" action, so rows using another one hide it
     via data-config-field-visible-if — hidden by visibility, not display, so the cell keeps its
     width and the columns stay lined up across rows. -->
<div class="dialog-overlay plugin-config-overlay hidden">
  <div class="dialog">
    <div class="dialog-header">
      <img src="{{pluginIcon}}" alt="">
      <span class="dialog-title">{{robotConfigTitle}}</span>
      <button class="dialog-close" type="button">✕</button>
    </div>
    <div class="dialog-fields">
      <div class="plugin-config-list robot-config-list" data-config-list="actions">
        <!-- Column headers, shown once above the rows. -->
        <div class="plugin-config-list-head">
          <span>{{robotConfigTarget}}</span>
          <span>{{robotConfigIdentifier}}<span class="field-help" data-tooltip="{{robotConfigIdentifierHint}}">?</span></span>
          <span>{{robotConfigValue}}<span class="field-help" data-tooltip="{{robotConfigValueHint}}">?</span></span>
        </div>
        <div class="plugin-config-list-rows" data-config-rows></div>
        <!-- One action row. Cloned by the host; the select binds like the text inputs (the host's
             row binding reads .value off any [data-config-field], so a <select> works as-is). -->
        <template data-config-row>
          <div class="plugin-config-list-row">
            <select data-config-field="target" data-config-field-default="button">
              <option value="button">{{robotConfigTargetButton}}</option>
              <option value="link">{{robotConfigTargetLink}}</option>
              <option value="input">{{robotConfigTargetInput}}</option>
              <option value="focus">{{robotConfigTargetFocus}}</option>
            </select>
            <input type="text" autocomplete="off" spellcheck="false"
                   data-config-field="identifier" data-config-field-default="">
            <!-- Only the "fill in text" action carries a value; for the others the field is hidden
                 (but keeps its grid cell, so the columns stay lined up across rows). -->
            <input type="text" autocomplete="off" spellcheck="false"
                   data-config-field="value" data-config-field-default=""
                   data-config-field-visible-if="target=input">
            <button type="button" class="plugin-config-row-remove" data-config-remove
                    aria-label="{{robotConfigRemoveRow}}" title="{{robotConfigRemoveRow}}">✕</button>
          </div>
        </template>
        <button type="button" class="plugin-config-add-row" data-config-add>+ {{robotConfigAddRow}}</button>
      </div>
      <span class="field-hint">{{robotConfigOrderHint}}</span>
    </div>
    <!-- Apply commits the edit to the app's config; Cancel/✕/backdrop/Esc discard. The host wires
         these by class (.plugin-config-apply / .plugin-config-cancel). -->
    <div class="confirm-actions">
      <button class="btn-cancel plugin-config-cancel" type="button">{{pluginConfigCancel}}</button>
      <button class="btn-save plugin-config-apply" type="button">{{pluginConfigApply}}</button>
    </div>
  </div>
</div>
