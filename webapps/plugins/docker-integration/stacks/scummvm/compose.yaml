# Curated ScummVM stack for the Voltage docker-integration plugin (linuxserver's KasmVNC-based image,
# web UI on container port 3000 — see stack.json's containerPort). ${VOLTAGE_PORT} is substituted by
# the plugin (default 8080 if run standalone); the plugin runs this with `docker compose -f <this
# file> up -d` and waits until the service answers before pointing the app window at
# http://localhost:${VOLTAGE_PORT}, optionally with a per-app path override (config.path, e.g.
# /play/tentacle) appended — see docker-integration.js routeSuffixFor.
#
# Bind mounts below are this machine's local paths — adjust before reusing on another host.
services:
  scummvm:
    image: lscr.io/linuxserver/scummvm:latest
    # No container_name: a fixed name is unique HOST-WIDE, across every compose project — it would
    # collide the moment a second app built from this stack (a different game, its own project
    # "voltage-<profile>") tried to start while the first is still running. Left unset, compose
    # derives a name from the project instead (e.g. "voltage-dot-scummvm-1"), which is unique per
    # project automatically — exactly what lets several such apps run at once.

    security_opt:
      - seccomp:unconfined

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Selkies otherwise resizes its virtual display to match the client viewport exactly (default
      # behaviour) — fine as long as Voltage requests a true 4:3 shape, but any small mismatch (e.g.
      # a shadow margin skewing the requested size off 4:3) makes ScummVM's own stretch_mode=fit add
      # compensating bars. With this on, the browser CSS-stretches the received frame to fill its
      # container exactly instead, so a mismatch can no longer produce a visible border.
      - SELKIES_USE_CSS_SCALING=true

    volumes:
      - /home/tschwerdt/Spiele/ScummVM/config:/config
      - /home/tschwerdt/Spiele/ScummVM/games:/games
      - /home/tschwerdt/Spiele/ScummVM/custom-cont-init.d:/custom-cont-init.d

    ports:
      - "${VOLTAGE_PORT:-8080}:3000"
